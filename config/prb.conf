# Configuration for the FM passive bistatic radar processing chain.
#
# Format follows the legacy Commensal Radar ProcServer convention:
#   - one KEY = VALUE per line
#   - the key is everything before the first '=', the value everything after
#   - surrounding whitespace is stripped from both
#   - '#' starts a comment, to end of line
#   - blank lines are ignored
#
# A key the program needs but cannot find is a fatal startup error, never a
# silent default. A key the program does not recognise is ignored, so this
# file can carry settings for tools that do not all read the same subset.
#
# Values that can be computed are deliberately NOT stored here. Samples per
# CPI, samples per hop, buffer capacity in samples and the Doppler bin count
# are all derived at load time, so they cannot drift out of step with the
# values they come from.


# ---------------------------------------------------------------------------
# Scenario. These MUST match the .fersxml used to generate the data.
# ---------------------------------------------------------------------------

SAMPLE_RATE_Hz = 204800

# Receiver names exactly as they appear in <receiver name="...">. The ingest
# layer learns which UDP stream is which by matching these against the
# receiver name in each context packet's JSON metadata.
REFERENCE_RECEIVER_NAME = ArmasuisseRefRxClean
SURVEILLANCE_RECEIVER_NAME = ArmasuisseSurRxClean


# ---------------------------------------------------------------------------
# Ingest
# ---------------------------------------------------------------------------

UDP_PORT = 4991

# Must match --vita49-fullscale on the fers-cli command line. It sets the
# float amplitude that maps to a full-scale int16 code, so a mismatch does not
# error, it silently scales every sample wrongly.
#
# 0.0022 was measured over the full 180 s scenario: the reference channel
# peaked at 11381 codes at fullscale 0.005, and 0.005 * 11381 / (0.8 * 32767)
# puts that peak at about 79% of full scale. See docs/design_decisions.md 5.2.
VITA49_FULLSCALE = 0.0022

# Rolling per-channel buffer length. Must comfortably exceed the CPI length,
# or extraction can never keep up; below twice the CPI length the loader warns.
BUFFER_LENGTH_s = 2.0


# ---------------------------------------------------------------------------
# Processing
# ---------------------------------------------------------------------------

# CPI length sets the Doppler resolution: 1 / CPI_LENGTH_s Hz per bin.
CPI_LENGTH_s = 1.0

# Step between consecutive CPI starts. Equal to CPI_LENGTH_s means
# back-to-back windows; less than it means overlapping windows, which give a
# smoother output for proportionally more compute.
CPI_HOP_s = 1.0

N_RANGE_BINS = 120

# ECA delay taps. Must be at least N_RANGE_BINS.
N_CLUTTER_TAPS = 120

DOPPLER_HALF_SPAN_Hz = 200

# Must divide the samples per CPI exactly, or the Doppler axis ends up subtly
# wrong. At 204800 samples and 128 this gives 1600 Doppler bins.
DOPPLER_DECIMATION = 128

# Fraction of a CPI window that must be non-zero for it to be processed. A
# dropped packet leaves a zero-filled gap, and a gappy window fed into clutter
# cancellation produces a near-zero, noise-like map that looks exactly like a
# genuine no-detection frame.
MIN_CPI_COVERAGE = 0.99


# ---------------------------------------------------------------------------
# DSI cancellation
# ---------------------------------------------------------------------------

# ECA-m  single solve over the whole CPI, matching the MATLAB reference chain
# ECA-B  batches: independent weights per fragment, tracks changing clutter
# ECA-S  sliding: long overlapping estimation window, short update interval
# ECA-CD by carrier and Doppler, in the frequency domain
# CGLS   iterative least squares
DSI_ALGORITHM = ECA-B

# CPU is the correctness reference, GPU is what gets benchmarked. Both are
# expected to produce the same answer; a disagreement is a bug in one of them.
DSI_BACKEND = CPU

# Working precision for the CPU backend: FP64 or FP32.
#
# FP64 is the reference and the only setting that matches MATLAB to 1e-4.
# FP32 exists to emulate the GPU, which has no practical alternative: the
# Jetson Nano's Maxwell GPU runs double-precision arithmetic at 1/32 the
# single-precision rate. Measured cost of FP32 on real data: ~5e-3 relative
# L2 against the MATLAB golden file, with suppression unchanged to four
# decimal places. The GPU backend ignores this key and is always FP32.
DSI_MATH_PRECISION = FP64

# T_A: the stretch of signal the cancellation weights are estimated from.
# 25 ms is the optimum Colone et al. (IEEE TAES 52(3), 2016, Fig. 1) measured
# for FM passive radar with a 1 s CPI, worth about 6 dB of clutter attenuation
# over whole-CPI ECA. At 204800 Hz this is 5120 samples, 40 per CPI.
#
# Ignored by ECA-m, which always uses the whole CPI.
ECA_BATCH_LENGTH_s = 0.025

# T_S: the stretch of signal one set of weights is applied to, and so the
# interval between weight updates. Equal to ECA_BATCH_LENGTH_s means ECA-B;
# shorter means ECA-S. Must divide the CPI exactly.
#
# This also sets where ECA-B's Doppler ambiguities land: independent per-batch
# weights are themselves a modulation, putting false peaks every 1/T_S Hz
# around any target inside the cancellation notch. At 25 ms that is every
# 40 Hz, inside the +-200 Hz shown. Moving them outside is what ECA-S is for.
ECA_UPDATE_INTERVAL_s = 0.025

# P: Doppler bins in the clutter subspace, which becomes K(2P+1) columns wide.
# Reaches clutter that is moving slowly rather than perfectly stationary.
# Only 0 is implemented; a non-zero value is rejected, not ignored.
ECA_DOPPLER_TAPS = 0

# Diagonal loading, as a FRACTION of the mean Gram diagonal. Keeps the solve
# well conditioned. Relative rather than absolute so it means the same thing
# whatever amplitude the samples arrive at -- an absolute value silently
# changes strength with the signal level. ECA-m overrides this with the
# MATLAB reference's absolute 1e-3.
ECA_DIAGONAL_LOADING = 1e-6

# CGLS. A fixed iteration count is what buys a fixed execution time and a
# fixed memory footprint, which matters more on an embedded target than
# stopping early would.
CGLS_ITERATIONS = 30
CGLS_TOLERANCE = 1e-6


# ---------------------------------------------------------------------------
# Detection (2D CA-CFAR)
# ---------------------------------------------------------------------------

CFAR_PFA = 1e-5

# Single-sided half-widths, in cells, per axis.
CFAR_GUARD_RANGE = 0
CFAR_GUARD_DOPPLER = 4
CFAR_TRAIN_RANGE = 0
CFAR_TRAIN_DOPPLER = 16
