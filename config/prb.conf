# Configuration for the FM passive bistatic radar processing chain.
#
# Format follows the legacy Commensal Radar ProcServer convention:
#   - one KEY = VALUE per line
#   - the key is everything before the first '=', the value everything after
#   - surrounding whitespace is stripped from both
#   - '#' starts a comment, to end of line
#   - blank lines are ignored
#
# A key the program needs but cannot find is a fatal startup error, never a
# silent default. A key the program does not recognise is ignored, so this
# file can carry settings for tools that do not all read the same subset.
#
# Values that can be computed are deliberately NOT stored here. Samples per
# CPI, samples per hop, buffer capacity in samples and the Doppler bin count
# are all derived at load time, so they cannot drift out of step with the
# values they come from.


# ---------------------------------------------------------------------------
# Scenario. These MUST match the .fersxml used to generate the data.
# ---------------------------------------------------------------------------

SAMPLE_RATE_Hz = 204800

# Receiver names exactly as they appear in <receiver name="...">. The ingest
# layer learns which UDP stream is which by matching these against the
# receiver name in each context packet's JSON metadata.
REFERENCE_RECEIVER_NAME = ArmasuisseRefRxClean
SURVEILLANCE_RECEIVER_NAME = ArmasuisseSurRxClean


# ---------------------------------------------------------------------------
# Ingest
# ---------------------------------------------------------------------------

UDP_PORT = 4991

# Must match --vita49-fullscale on the fers-cli command line. It sets the
# float amplitude that maps to a full-scale int16 code, so a mismatch does not
# error, it silently scales every sample wrongly.
#
# 0.0022 was measured over the full 180 s scenario: the reference channel
# peaked at 11381 codes at fullscale 0.005, and 0.005 * 11381 / (0.8 * 32767)
# puts that peak at about 79% of full scale. See docs/design_decisions.md 5.2.
VITA49_FULLSCALE = 0.0022

# Rolling per-channel buffer length. Must comfortably exceed the CPI length,
# or extraction can never keep up; below twice the CPI length the loader warns.
BUFFER_LENGTH_s = 2.0


# ---------------------------------------------------------------------------
# Processing
# ---------------------------------------------------------------------------

# CPI length sets the Doppler resolution: 1 / CPI_LENGTH_s Hz per bin.
CPI_LENGTH_s = 1.0

# Step between consecutive CPI starts. Equal to CPI_LENGTH_s means
# back-to-back windows; less than it means overlapping windows, which give a
# smoother output for proportionally more compute.
CPI_HOP_s = 1.0

N_RANGE_BINS = 120

# ECA delay taps. Must be at least N_RANGE_BINS.
N_CLUTTER_TAPS = 120

DOPPLER_HALF_SPAN_Hz = 200

# Must divide the samples per CPI exactly, or the Doppler axis ends up subtly
# wrong. At 204800 samples and 128 this gives 1600 Doppler bins.
DOPPLER_DECIMATION = 128

# Fraction of a CPI window that must be non-zero for it to be processed. A
# dropped packet leaves a zero-filled gap, and a gappy window fed into clutter
# cancellation produces a near-zero, noise-like map that looks exactly like a
# genuine no-detection frame.
MIN_CPI_COVERAGE = 0.99


# ---------------------------------------------------------------------------
# Detection (2D CA-CFAR)
# ---------------------------------------------------------------------------

CFAR_PFA = 1e-5

# Single-sided half-widths, in cells, per axis.
CFAR_GUARD_RANGE = 2
CFAR_GUARD_DOPPLER = 2
CFAR_TRAIN_RANGE = 4
CFAR_TRAIN_DOPPLER = 8
